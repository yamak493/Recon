# Recon Configuration

# DO NOT CHANGE THIS VERSION
config-version: 1

# Whether players can register their own connection profiles
# When true, any player can use "/recon create" to register themselves
allow-self-registration: false

# Whether to automatically create connection profiles for players on join
# This requires allow-self-registration to be true.
# The user name will be the player name, and a random password will be generated.
auto-registration: false

# HTTP server port
port: 4161

# HTTP server bind address
# Leave empty to listen on all network interfaces (0.0.0.0).
# Set to "127.0.0.1" to only accept connections from the local machine
# (recommended when Recon is placed behind a reverse proxy / TLS terminator).
bind-address: ""

# Global IP whitelist (applies to all users)
# Leave empty to allow all IPs
global-ip-whitelist: []

# Forward incoming API requests to other Recon servers
# Format: host:port (or full URL such as http://host:port)
# These requests are forwarded asynchronously and this server does not wait for responses.
request-forwarding: []

# Whether all connection users can use queue feature
# false: queue=true in request is ignored unless users.yml has queue: true for that user
# true: queue=true in request enables queue feature for all users
allow-queue-for-all-users: false

# Maximum hours to keep offline player command queues
# Expired commands are automatically removed (default: 72 hours = 3 days)
queue-expiry-hours: 72

# Rate limit: maximum requests per minute from the same IP address
rate-limit: 30

# Security / protocol settings
security:
  # Protocol versions:
  #   v1 (legacy): AES-256-CBC + single SHA-256 key derivation, no message authentication.
  #   v2 (recommended): AES-256-GCM (authenticated encryption) + PBKDF2-HMAC-SHA256.
  #     v2 detects tampering, binds metadata (user/nonce/timestamp) into the ciphertext,
  #     and makes offline password brute-force expensive. This provides meaningful
  #     security even WITHOUT a TLS certificate.
  #
  # Allow legacy v1 clients. Set to false to require v2 from every client.
  # Recommended: false for new deployments (especially when not behind TLS).
  allow-legacy-protocol: true
  #
  # Minimum PBKDF2 iteration count the server will accept for v2 (per request).
  # The client sends its own iteration count; the server rejects anything below this
  # floor (too weak) or above the internal hard cap of 1000000 (CPU-DoS protection).
  # Higher = stronger against offline brute-force, but more CPU/latency per request.
  # Auto-generated credentials are high-entropy, so 100000 is a strong default;
  # raise it if you allow weak, user-chosen passwords (and raise it in clients too).
  # Minimum enforced: 10000.
  pbkdf2-iterations: 100000

# Language code for messages
# Supported: en, hi, zh, es, ar, fr, ru, pt, id, de, ja
language: en

# User data storage
# enabled: true to use database, false to use users.yml
database:
  enabled: false
  host: 127.0.0.1
  port: 3306
  name: recon
  username: root
  password: password
  
  # Table names will be: <table-prefix>users
  table-prefix: recon_

  # JDBC options
  use-ssl: false
  connect-timeout-ms: 5000
  socket-timeout-ms: 10000

# When database is enabled and the database table is empty,
# existing users.yml entries are imported automatically once.
migrate-from-yaml-on-first-run: true